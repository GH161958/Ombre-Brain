name: Tests

on:
  push:
    branches: [main, testing]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main, testing]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_VERSION: '0.11.23'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare wake branch generated artifacts
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/continuity-first-wake-surface'
        run: |
          git fetch origin main
          python - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          import subprocess

          path = Path("src/tools/breath/surface.py")
          base = subprocess.check_output(
              ["git", "show", "origin/main:src/tools/breath/surface.py"]
          )
          current = path.read_bytes()

          def split_lines(data: bytes):
              rows = []
              for raw in data.splitlines(keepends=True):
                  if raw.endswith(b"\r\n"):
                      rows.append((raw[:-2], b"\r\n"))
                  elif raw.endswith(b"\n"):
                      rows.append((raw[:-1], b"\n"))
                  elif raw.endswith(b"\r"):
                      rows.append((raw[:-1], b"\r"))
                  else:
                      rows.append((raw, b""))
              return rows

          def nearest_eol(rows, index, fallback):
              if not rows:
                  return fallback or b"\n"
              index = min(max(index, 0), len(rows) - 1)
              for distance in range(len(rows)):
                  for candidate in (index - distance, index + distance):
                      if 0 <= candidate < len(rows):
                          eol = rows[candidate][1]
                          if eol:
                              return eol
              return fallback or b"\n"

          base_rows = split_lines(base)
          current_rows = split_lines(current)
          matcher = SequenceMatcher(
              None,
              [body for body, _ in base_rows],
              [body for body, _ in current_rows],
              autojunk=False,
          )

          rebuilt = []
          for tag, i1, i2, j1, j2 in matcher.get_opcodes():
              if tag == "equal":
                  rebuilt.extend(body + eol for body, eol in base_rows[i1:i2])
                  continue
              for offset, (body, eol) in enumerate(current_rows[j1:j2]):
                  is_last = j1 + offset == len(current_rows) - 1
                  if is_last and not eol:
                      chosen = b""
                  else:
                      anchor = i1 + min(offset, max(0, i2 - i1 - 1))
                      chosen = nearest_eol(base_rows, anchor, eol)
                  rebuilt.append(body + chosen)

          rebuilt_bytes = b"".join(rebuilt)
          normalize = lambda data: data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          if normalize(rebuilt_bytes) != normalize(current):
              raise SystemExit("line-ending repair changed semantic text")
          path.write_bytes(rebuilt_bytes)
          PY
          git add src/tools/breath/surface.py
          python deploy/gen_update_manifest.py
          cp src/tools/breath/surface.py /tmp/wake-surface.py
          cp update_manifest.json /tmp/wake-update-manifest.json

      - name: Verify hot-update manifest
        run: python deploy/gen_update_manifest.py --check

      - name: Install lockfile tool
        run: |
          python -m pip install "uv==$UV_VERSION"

      - name: Verify dependency lockfiles
        # 固定到当前发布锁首次生成时的索引快照；升级依赖时需显式推进并重生成两份锁。
        # 2026-08-09：推进到 2026-08-01，只为吃到 cryptography 50.0.0（修复 PYSEC-2026-3552，
        # 旧快照 2026-07-12 早于该版本发布日 2026-07-31，pip-audit 永远卡在 49.0.0 上）。
        env:
          UV_EXCLUDE_NEWER: '2026-08-01T00:00:00Z'
        run: |
          rm -f requirements.lock.txt requirements-dev.lock.txt
          uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes --output-file requirements.lock.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 --generate-hashes --output-file requirements-dev.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-dev.lock.txt

      - name: Install locked dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Wake syntax check
        run: >-
          python -m py_compile
          src/tools/breath/surface.py
          tests/test_breath_wake_policy.py

      - name: Wake focused regression
        run: >-
          python -m pytest
          tests/test_breath_wake_policy.py
          -q --asyncio-mode=auto

      - name: Existing breath regressions
        run: >-
          python -m pytest
          tests/test_breath*.py
          tests/test_pinned_visibility_regression.py
          -q --asyncio-mode=auto

      - name: Run static checks
        run: ruff check src tools deploy tests --no-cache

      - name: Run security checks
        run: |
          bandit -r src tools deploy -ll -ii -q
          pip-audit -r requirements.lock.txt

      - name: Generate production dependency SBOM
        run: >-
          cyclonedx-py requirements requirements.lock.txt
          --spec-version 1.6
          --output-reproducible
          --output-format JSON
          --output-file sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ombre-brain-python-sbom
          path: sbom.cdx.json

      - name: Run full local suite with coverage
        run: >-
          python -m pytest tests -q
          --asyncio-mode=auto
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Run LLM quality tests
        if: env.OMBRE_COMPRESS_API_KEY != ''
        env:
          OMBRE_COMPRESS_API_KEY: ${{ secrets.OMBRE_COMPRESS_API_KEY }}
        run: python -m pytest tests/test_llm_quality.py -v --asyncio-mode=auto

      - name: Start isolated Docker MCP stack
        # AI_NAME 必须给一个非泛化值：letter_write 创建带锁 Letter 时要求写信人
        # 有「实际关系名」，"ai"/"assistant"/"claude" 等通用占位会被 tools/plan/core.py
        # 的 _is_actual_relation_name 判定为不合法而拒绝创建（这是设计如此的准入门槛，
        # 不是 bug）——不给这个变量，test_letter_time_lock_write_read_and_owner_unlock_in_real_container
        # 会在这道拒绝上失败。用 "张三"：单测里（test_letter_time_lock.py、
        # test_breath_hook_security.py 等）早已用它做 AI_NAME 测试夹具，
        # test_web_api_docker_integration.py 也硬编码断言 writer_name == "张三"，
        # 换别的名字这条集成测试会跟着失败。
        #
        # OMBRE_HOOK_ALLOW_PUBLIC=1：test_web_api_docker_integration.py 专门验证
        # 「显式打开 public 模式后 /breath-hook 允许匿名访问」这条路径（见
        # web/hooks.py _is_hook_request_authorized）。容器是仅 127.0.0.1 可达、
        # 用完即删的 CI 隔离实例，开这个不影响任何真实部署的默认鉴权。
        run: |
          docker network create ob-ci-net
          docker volume create ob-ci-data
          docker run -d --name ob-ci-llm --network ob-ci-net \
            -v "$PWD:/workspace:ro" -w /workspace python:3.12-slim \
            python tests/mcp_llm_stub.py
          docker build -t ombre-brain-ci:local .
          docker run -d --name ob-ci-app --network ob-ci-net \
            -p 127.0.0.1:18084:8000 \
            -v ob-ci-data:/app/buckets \
            -e OMBRE_COMPRESS_MODEL=ombre-stub \
            -e OMBRE_COMPRESS_API_FORMAT=openai_compat \
            -e OMBRE_COMPRESS_API_KEY=audit-key \
            -e OMBRE_COMPRESS_BASE_URL=http://ob-ci-llm:8080/v1 \
            -e OMBRE_MCP_REQUIRE_AUTH=false \
            -e OMBRE_BIND_ADDRESS=127.0.0.1 \
            -e OMBRE_SETUP_TOKEN=docker-audit-setup-token \
            -e AI_NAME=张三 \
            -e OMBRE_HOOK_ALLOW_PUBLIC=1 \
            ombre-brain-ci:local
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:18084/health && break
            if [ "$attempt" -eq 60 ]; then
              docker logs ob-ci-app
              exit 1
            fi
            sleep 1
          done

      - name: Run 15-tool Docker MCP integration suite
        env:
          OMBRE_DOCKER_INTEGRATION_URL: http://127.0.0.1:18084/mcp
          OMBRE_DOCKER_EXPECT_COMPRESSION_PROVIDER: "1"
        run: >-
          python -m pytest tests/test_mcp_tools_docker_integration.py -q
          --timeout=60

      - name: Run Docker Web management integration suite
        env:
          OMBRE_DOCKER_WEB_BASE_URL: http://127.0.0.1:18084
          OMBRE_DOCKER_SETUP_TOKEN: docker-audit-setup-token
        run: >-
          python -m pytest tests/test_web_api_docker_integration.py -q
          --timeout=120

      - name: Wake diff whitespace check
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/continuity-first-wake-surface'
        run: |
          git diff --check origin/main...HEAD
          git diff --cached --check

      - name: Persist wake generated artifacts to feature branch
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feat/continuity-first-wake-surface'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/wake-surface.py src/tools/breath/surface.py
          cp /tmp/wake-update-manifest.json update_manifest.json
          git add src/tools/breath/surface.py update_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh wake patch manifest and line endings"
          git push origin "$GITHUB_HEAD_REF"

      - name: Clean Docker MCP stack
        if: always()
        run: |
          docker rm -f ob-ci-app ob-ci-llm || true
          docker volume rm ob-ci-data || true
          docker network rm ob-ci-net || true
