name: Wake config doc patch

on:
  push:
    branches: [docs/wake-config-example]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/wake-config-example
          fetch-depth: 0

      - name: Insert wake config example without rewriting existing line endings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config.example.yaml")
          data = path.read_bytes()
          if b"  wake:\n" in data or b"  wake:\r\n" in data:
              print("wake stanza already present")
          else:
              marker = b"  feel_max_tokens: 6000"
              start = data.find(marker)
              if start < 0:
                  raise SystemExit("feel_max_tokens anchor not found")
              newline = data.find(b"\n", start)
              if newline < 0:
                  raise SystemExit("anchor line ending not found")
              eol = b"\r\n" if newline > 0 and data[newline - 1:newline + 1] == b"\r\n" else b"\n"
              insert_at = newline + 1
              lines = [
                  b"  # Wake policy applies only to spontaneous no-query breath(); explicit breath_search() is unaffected.",
                  b"  # Wake policy: continuity first, then ordinary, then pure work. Set enabled=false for legacy order.",
                  b"  wake:",
                  b"    enabled: true",
                  b"    pure_work_max: 1",
                  b"    continuity_labels: [relationship, identity, continuity, voice]",
                  b"    work_labels: [work]",
              ]
              block = eol.join(lines) + eol
              path.write_bytes(data[:insert_at] + block + data[insert_at:])
          PY

      - name: Commit only the config example and remove this temporary workflow
        run: |
          rm .github/workflows/wake-config-doc-patch.yml
          git add config.example.yaml .github/workflows/wake-config-doc-patch.yml
          git diff --cached --check --ignore-space-at-eol
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document wake surfacing config"
          git push origin HEAD:docs/wake-config-example
