name: Wake full-suite diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite-diagnostic:
    if: github.head_ref == 'feat/continuity-first-wake-surface'
    runs-on: ubuntu-latest
    env:
      UV_VERSION: '0.11.23'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reproduce wake generated-artifact preparation
        run: |
          git fetch origin main
          python - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          import subprocess

          path = Path("src/tools/breath/surface.py")
          base = subprocess.check_output(
              ["git", "show", "origin/main:src/tools/breath/surface.py"]
          )
          current = path.read_bytes()

          def split_lines(data: bytes):
              rows = []
              for raw in data.splitlines(keepends=True):
                  if raw.endswith(b"\r\n"):
                      rows.append((raw[:-2], b"\r\n"))
                  elif raw.endswith(b"\n"):
                      rows.append((raw[:-1], b"\n"))
                  elif raw.endswith(b"\r"):
                      rows.append((raw[:-1], b"\r"))
                  else:
                      rows.append((raw, b""))
              return rows

          def nearest_eol(rows, index, fallback):
              if not rows:
                  return fallback or b"\n"
              index = min(max(index, 0), len(rows) - 1)
              for distance in range(len(rows)):
                  for candidate in (index - distance, index + distance):
                      if 0 <= candidate < len(rows):
                          eol = rows[candidate][1]
                          if eol:
                              return eol
              return fallback or b"\n"

          base_rows = split_lines(base)
          current_rows = split_lines(current)
          matcher = SequenceMatcher(
              None,
              [body for body, _ in base_rows],
              [body for body, _ in current_rows],
              autojunk=False,
          )

          rebuilt = []
          for tag, i1, i2, j1, j2 in matcher.get_opcodes():
              if tag == "equal":
                  rebuilt.extend(body + eol for body, eol in base_rows[i1:i2])
                  continue
              for offset, (body, eol) in enumerate(current_rows[j1:j2]):
                  is_last = j1 + offset == len(current_rows) - 1
                  if is_last and not eol:
                      chosen = b""
                  else:
                      anchor = i1 + min(offset, max(0, i2 - i1 - 1))
                      chosen = nearest_eol(base_rows, anchor, eol)
                  rebuilt.append(body + chosen)

          rebuilt_bytes = b"".join(rebuilt)
          normalize = lambda data: data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          if normalize(rebuilt_bytes) != normalize(current):
              raise SystemExit("line-ending repair changed semantic text")
          path.write_bytes(rebuilt_bytes)
          PY
          git add src/tools/breath/surface.py
          python deploy/gen_update_manifest.py

      - name: Install lockfile tool
        run: python -m pip install "uv==$UV_VERSION"

      - name: Install locked test dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Run canonical full local suite with captured output
        run: |
          set -o pipefail
          python -m pytest tests -q \
            --asyncio-mode=auto \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            2>&1 | tee pytest-full.log

      - name: Upload full-suite diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wake-full-suite-diagnostic
          path: |
            pytest-full.log
            coverage.xml
          if-no-files-found: warn
