name: Wake policy checks

on:
  push:
    branches:
      - feat/continuity-first-wake-surface

permissions:
  contents: read

jobs:
  wake-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lockfile tool
        run: python -m pip install "uv==0.11.23"

      - name: Install locked test dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Syntax check
        run: >-
          python -m py_compile
          src/tools/breath/surface.py
          tests/test_breath_wake_policy.py

      - name: Focused lint
        run: >-
          ruff check
          src/tools/breath/surface.py
          tests/test_breath_wake_policy.py
          --no-cache

      - name: Focused wake regression
        run: >-
          python -m pytest
          tests/test_breath_wake_policy.py
          -q --asyncio-mode=auto

      - name: Existing breath regressions
        run: >-
          python -m pytest
          tests/test_breath*.py
          tests/test_pinned_visibility_regression.py
          -q --asyncio-mode=auto

      - name: Diff whitespace check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
