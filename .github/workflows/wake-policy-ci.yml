name: Wake policy checks

on:
  push:
    branches:
      - feat/continuity-first-wake-surface

permissions:
  contents: write

jobs:
  wake-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Preserve main line endings on unchanged surface lines
        run: |
          git fetch origin main
          python - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          import subprocess

          path = Path("src/tools/breath/surface.py")
          base = subprocess.check_output(
              ["git", "show", "origin/main:src/tools/breath/surface.py"]
          )
          current = path.read_bytes()

          def split_lines(data: bytes):
              rows = []
              for raw in data.splitlines(keepends=True):
                  if raw.endswith(b"\r\n"):
                      rows.append((raw[:-2], b"\r\n"))
                  elif raw.endswith(b"\n"):
                      rows.append((raw[:-1], b"\n"))
                  elif raw.endswith(b"\r"):
                      rows.append((raw[:-1], b"\r"))
                  else:
                      rows.append((raw, b""))
              return rows

          def nearest_eol(rows, index, fallback):
              if not rows:
                  return fallback or b"\n"
              index = min(max(index, 0), len(rows) - 1)
              for distance in range(len(rows)):
                  for candidate in (index - distance, index + distance):
                      if 0 <= candidate < len(rows):
                          eol = rows[candidate][1]
                          if eol:
                              return eol
              return fallback or b"\n"

          base_rows = split_lines(base)
          current_rows = split_lines(current)
          matcher = SequenceMatcher(
              None,
              [body for body, _ in base_rows],
              [body for body, _ in current_rows],
              autojunk=False,
          )

          rebuilt = []
          for tag, i1, i2, j1, j2 in matcher.get_opcodes():
              if tag == "equal":
                  rebuilt.extend(body + eol for body, eol in base_rows[i1:i2])
                  continue
              for offset, (body, eol) in enumerate(current_rows[j1:j2]):
                  is_last = j1 + offset == len(current_rows) - 1
                  if is_last and not eol:
                      chosen = b""
                  else:
                      anchor = i1 + min(offset, max(0, i2 - i1 - 1))
                      chosen = nearest_eol(base_rows, anchor, eol)
                  rebuilt.append(body + chosen)

          rebuilt_bytes = b"".join(rebuilt)
          normalize = lambda data: data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          if normalize(rebuilt_bytes) != normalize(current):
              raise SystemExit("line-ending repair changed semantic text")
          path.write_bytes(rebuilt_bytes)
          PY
          git add src/tools/breath/surface.py

      - name: Refresh hot-update manifest from staged source bytes
        run: |
          python deploy/gen_update_manifest.py
          git add update_manifest.json

      - name: Install lockfile tool
        run: python -m pip install "uv==0.11.23"

      - name: Install locked test dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Syntax check
        run: >-
          python -m py_compile
          src/tools/breath/surface.py
          tests/test_breath_wake_policy.py

      - name: Focused lint
        run: >-
          ruff check
          src/tools/breath/surface.py
          tests/test_breath_wake_policy.py
          --no-cache

      - name: Focused wake regression
        run: >-
          python -m pytest
          tests/test_breath_wake_policy.py
          -q --asyncio-mode=auto

      - name: Existing breath regressions
        run: >-
          python -m pytest
          tests/test_breath*.py
          tests/test_pinned_visibility_regression.py
          -q --asyncio-mode=auto

      - name: Diff whitespace check
        run: |
          git diff --check origin/main...HEAD
          git diff --cached --check

      - name: Commit generated byte-preserving cleanup
        run: |
          if git diff --cached --quiet; then
            echo "No generated cleanup to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh wake patch manifest and line endings"
          git push origin HEAD:feat/continuity-first-wake-surface
